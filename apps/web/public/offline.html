<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00b494">
<title>Sin conexión · Easyway GPS</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111827;
    background: radial-gradient(circle at 20% 10%, #d2f9f0, transparent 45%), #f9fafb; }
  main { max-width: 380px; width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px 24px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 1.3rem; margin: 16px 0 8px; }
  p { color: #6b7280; line-height: 1.5; margin: 0 0 20px; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: #00b494; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/iconos/icono-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>No hay internet en este momento. Cuando vuelva la señal, toca "Reintentar" para seguir registrando tus trabajos.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
